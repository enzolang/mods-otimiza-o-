; >>> TOWNFALL-OTIMIZACAO (inicio) <<<
; Ajustes para SILENT HILL: TOWNFALL (Steam, Unreal Engine 5.6).
;
; Este arquivo e pequeno de proposito. Nesta versao da Unreal, quase
; todos os "stutter fix" famosos da internet ja vem ligados de fabrica,
; foram removidos da engine ou sao arriscados (podem travar o jogo ou
; fazer voce cair do mapa). O que mais ajuda e o menu do jogo: veja o
; LEIAME.md.
;
; Regra da Unreal: comentario so em linha propria, comecando com ";".
; Nunca escreva comentario no fim de uma linha de ajuste.

[SystemSettings]
; --- Memoria de video (VRAM) ---
; Trava de seguranca: quando a VRAM fica quase cheia, a Unreal diminui o
; espaco das texturas em vez de estourar (algumas ficam um pouco menos
; nitidas). Na Unreal padrao isso ja vem ligado nas Texturas Baixa/Media/
; Alta (o jogo pode mudar isso); aqui fica garantido em qualquer nivel.
; Nao limita o resto da VRAM (sombras, luz, efeitos): o medidor de
; memoria do menu continua sendo o principal.
r.Streaming.LimitPoolSizeToVRAM=1

; --- Limpeza de memoria (garbage collection) ---
; A Unreal da uma pausa curtinha a cada ~60 s para limpar a memoria.
; Com 32 GB de RAM da para espacar isso para 90 s. Ganho pequeno e nao
; medido neste jogo; cada limpeza pode ficar um pouco mais demorada.
gc.TimeBetweenPurgingPendingKillObjects=90

; --- OPCIONAIS (desligados) ---
; Para ligar um deles, tire o ";" do comeco da linha do ajuste e rode o
; instalar.bat (se ja instalou, e so rodar de novo).
;
; Tira a aberracao cromatica (bordas coloridas nos cantos). So visual.
; Pode nao mudar nada se o jogo usar um efeito proprio ou se o
; Pos-processamento estiver em Media ou Baixa (na Unreal padrao esses
; niveis ja tiram esse efeito; so faz diferenca em Alta ou Ultra).
;r.SceneColorFringeQuality=0
;
; Tira o granulado de filme. So visual; o granulado faz parte do clima.
; Mesma ressalva da linha acima.
;r.FilmGrain=0
;
; Texturas mais nitidas vistas de lado (filtro anisotropico 16x).
; Custo praticamente zero na RTX 3050.
;r.MaxAnisotropy=16
;
; Forca o DLSS 4 (modelo "transformer", preset K). Imagem bem mais nitida,
; o que permite usar o DLSS um degrau abaixo (ex.: Equilibrado em vez de
; Qualidade). Custa um pouco mais de GPU que o DLSS padrao. Se o DLSS do
; jogo nao tiver esse modelo, ele volta sozinho para o padrao. Nao use
; junto com a substituicao de DLSS do NVIDIA App (o app tem prioridade).
;r.NGX.DLSS.Preset=11
; >>> TOWNFALL-OTIMIZACAO (fim) <<<
