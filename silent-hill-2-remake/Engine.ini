; >>> SH2-OTIMIZACAO (inicio) <<<
; Ajustes de desempenho para SILENT HILL 2 (Remake, Steam).
; Estes ajustes ajudam com travadas (stutter), mas nao substituem as
; configuracoes do menu do jogo. Veja o LEIAME.md.
; Para desfazer, rode desinstalar.bat ou apague este bloco.

[SystemSettings]
; --- Cache de shaders/PSO ---
; Guarda em disco os shaders ja compilados, para o jogo nao precisar
; compilar de novo (e travar) toda vez que um efeito aparece.
r.ShaderPipelineCache.Enabled=1
D3D12.PSO.DiskCache=1
D3D12.PSO.DriverOptimizedDiskCache=1

; --- Travadas ao andar pela cidade (carregamento de areas) ---
; Evita uma coleta de lixo completa (pausa longa) logo depois que uma
; area sai da memoria. A limpeza continua acontecendo, so que aos poucos.
s.ForceGCAfterLevelStreamedOut=0
s.ContinuouslyIncrementalGCWhileLevelsPendingPurge=0

; Divide o trabalho de carregar areas novas em pedacos menores por quadro.
; Areas podem demorar um pouquinho mais para carregar, mas sem picos.
s.AsyncLoadingTimeLimit=3
s.LevelStreamingActorsUpdateTimeLimit=3
s.UnregisterComponentsTimeLimit=1

; --- Texturas ---
; Impede o jogo de usar mais memoria de video do que a placa tem
; (estourar a VRAM e uma causa comum de travadas).
r.Streaming.LimitPoolSizeToVRAM=1

; OPCIONAL: tamanho do cache de texturas, em MB. So mexa se as texturas
; ficarem borradas ou se continuar travando. Tire o ";" do comeco da
; linha abaixo e troque o numero conforme a VRAM da sua placa:
;   6 GB -> 2048 | 8 GB -> 3072 | 10-12 GB -> 4096 | 16 GB ou mais -> 6144
;r.Streaming.PoolSize=3072

; --- Efeito de lente ---
; Remove a aberracao cromatica (bordas coloridas). Ganho pequeno,
; imagem mais limpa. Apague a linha se preferir o visual original.
r.SceneColorFringeQuality=0
; >>> SH2-OTIMIZACAO (fim) <<<
